services:
  redis:
    image: redis:7.4-alpine
    # Keep the complete validated snapshot in memory. Persistence is disabled in
    # the free-tier demo stack to avoid duplicating millions of feature keys on disk.
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "3gb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      REDIS_URL: redis://host.docker.internal:6379/0
      ARTIFACT_DIR: /app/artifacts
      MODEL_PATH: /app/artifacts/bpr_ranker.pt
      RANKING_MODE: champion
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
      API_KEY: ${API_KEY:-codespace-demo-key}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-2000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8000:8000"]
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      redis: {condition: service_healthy}

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.1
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--serve-artifacts", "--artifacts-destination", "/mlflow/artifacts"]
    ports: ["5000:5000"]
    volumes: ["mlflow-data:/mlflow"]

  prometheus:
    image: prom/prometheus:v3.4.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [api]

  spark:
    profiles: ["features"]
    build:
      context: .
      dockerfile: Dockerfile.spark
    volumes:
      - ./data:/app/data
      - ./sql:/app/sql:ro
    command: ["spark_jobs/build_offline_features.py", "--input", "data/processed/events_train.csv"]

volumes:
  redis-data:
  mlflow-data:
