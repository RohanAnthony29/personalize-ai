[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personalize-ai"
version = "0.1.0"
description = "Production-style real-time recommendation and personalization platform"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
